<header class="site-header" id="site-header" data-mega-menu-root data-mega-menu-state="closed">
  <div class="header-inner layout-container layout-container--wide">
    <a class="site-logo" href="./index.html" aria-label="Завод «Каскад» — главная страница">
      <img src="../assets/images/logo-cascade.svg" alt="Завод «Каскад». Российский завод систем ограждений">
    </a>

    <nav class="desktop-navigation" aria-label="Основная навигация" data-mega-menu-navigation>
      <ul>
        <li><button type="button" id="mega-menu-trigger-products" data-mega-menu-trigger aria-expanded="false" aria-controls="mega-menu-products">Продукция</button></li>
        <li><button type="button" id="mega-menu-trigger-turnkey" data-mega-menu-trigger aria-expanded="false" aria-controls="mega-menu-turnkey">Типовые решения</button></li>
        <li><button type="button" id="mega-menu-trigger-special" data-mega-menu-trigger aria-expanded="false" aria-controls="mega-menu-special">Спецрешения</button></li>
        <li><button type="button" id="mega-menu-trigger-company" data-mega-menu-trigger aria-expanded="false" aria-controls="mega-menu-company">О компании</button></li>
        <!-- TODO: заменить временные ссылки после появления маршрутов в следующих подэтапах. -->
        <li><a href="#project-designers">Проектировщикам</a></li>
        <li><a href="#contacts">Контакты</a></li>
      </ul>
    </nav>

    <div class="header-contacts" aria-label="Контакты">
      <a href="tel:88003512054">8 (800) 351-20-54</a>
      <a href="mailto:zakaz@cascade.su">zakaz@cascade.su</a>
    </div>
    <button type="button" data-modal-open="estimate-modal" aria-haspopup="dialog" aria-controls="estimate-modal">Заказать расчёт</button>
    <div class="mobile-header-actions">
      <a href="tel:88003512054" aria-label="Позвонить на завод"><img src="../assets/icons/phone.svg" alt="" aria-hidden="true"></a>
      <a href="mailto:zakaz@cascade.su" aria-label="Написать на электронную почту"><img src="../assets/icons/mail.svg" alt="" aria-hidden="true"></a>
      <button type="button" data-mobile-navigation-toggle aria-expanded="false" aria-controls="mobile-navigation" aria-label="Открыть мобильное меню"><img src="../assets/icons/menu.svg" alt="" aria-hidden="true"></button>
    </div>
  </div>

  <div class="mega-menu-overlay" hidden></div>
  {{> mega-menu-products}}
  {{> mega-menu-turnkey}}
  {{> mega-menu-special}}
  {{> mega-menu-company}}
  {{> mobile-navigation}}
</header>
