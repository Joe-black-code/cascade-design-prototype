<div class="estimate-modal" id="estimate-modal" data-modal data-modal-backdrop aria-hidden="true" hidden>
  <div class="estimate-modal-dialog" data-modal-dialog role="dialog" aria-modal="true" aria-labelledby="estimate-modal-title" aria-describedby="estimate-modal-description" tabindex="-1">
    <button class="icon-control estimate-modal-close" type="button" data-modal-close aria-label="Закрыть окно запроса расчёта"><img src="../assets/icons/close.svg" alt="" aria-hidden="true"></button>
    <h2 id="estimate-modal-title">Заказать расчёт</h2>
    <p id="estimate-modal-description">Передайте техническое задание или смету для расчёта.</p>
    <div class="estimate-modal-form-slot" aria-label="Область формы запроса расчёта">
      {{> forms/estimate-form formId=formId fieldPrefix=fieldPrefix}}
    </div>
  </div>
</div>
