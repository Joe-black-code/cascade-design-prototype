name: CP-2.1B visual review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/e2e/shared-shell.spec.js --project=desktop-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp-2.1b-visual-review
          path: /tmp/cascade-qa/*.png
          retention-days: 5
          if-no-files-found: error
